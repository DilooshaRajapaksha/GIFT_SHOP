# App Identity
spring.application.name=GiftCraft-BackEnd

# Secrets are NOT written here any more. They come from environment variables
# or from a local .env file (see .env.example). The .env file is in .gitignore.
# Two paths because IntelliJ may run the app from GIFT_SHOP or from GiftCraft-BackEnd
spring.config.import=optional:file:.env[.properties],optional:file:GiftCraft-BackEnd/.env[.properties]
server.port=8082

# Database (GiftShop)
spring.datasource.url=jdbc:mysql://localhost:3306/giftshoplast?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# SQL logging is off - it would print customer names / phones into the log
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
# DEBUG on everything made the console unreadable, INFO is enough normally
logging.level.root=INFO
# don't send Java error details to the browser (our GlobalExceptionHandler sends a short message instead)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Email (Gmail App Password required)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Spring Boot
spring.main.allow-circular-references=true

# Image uploads from the admin panel
# Spring's default limit is 1MB, phone photos are usually bigger
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# images are saved as files here (outside src/), the database only stores the link
app.image-dir=${IMAGE_DIR:uploads/images}

# Admin panel password (set ADMIN_PASSWORD in .env)
app.admin-password=${ADMIN_PASSWORD}
# secret used to sign the admin login token (at least 32 characters, JWT_SECRET in .env)
app.jwt-secret=${JWT_SECRET:}

# which websites may call this API from the browser (comma separated)
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# only the health check is public, nothing else from actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# email is not used yet, so don't let it mark the app as "down"
management.health.mail.enabled=false
